# Force dhcpcd as the DHCP client.
# Alpine's NetworkManager ships 20-dhcp-internal.conf in
# /usr/lib/NetworkManager/conf.d/ which sets dhcp=internal; the conf.d
# drop-ins are read after the main file, and /etc/.../conf.d beats
# /usr/lib/.../conf.d, so this wins over both the main config and the
# package's internal-DHCP default.
[main]
dhcp=dhcpcd
