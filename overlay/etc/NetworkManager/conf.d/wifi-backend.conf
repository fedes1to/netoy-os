# Wi-Fi backend selection for NetworkManager.
# This file is rewritten by /usr/local/bin/netoy-backend when the user
# switches between wpa_supplicant and iwd from the netoy-tui Network tab.
#
#   wpa_supplicant (default):
#     [device]
#     wifi.backend=wpa_supplicant
#
#   iwd:
#     [device]
#     wifi.backend=iwd
#     wifi.iwd.autoconnect=yes
#
# NetworkManager must be restarted after any change here.

[device]
wifi.backend=wpa_supplicant
