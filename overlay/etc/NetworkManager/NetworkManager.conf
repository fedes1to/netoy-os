# NetworkManager configuration for the netoy appliance.
#
# Wi-Fi backend: wpa_supplicant (default, via the wifi plugin).
# DHCP client: NetworkManager's built-in client (dhcp=internal — Alpine
#   ships 20-dhcp-internal.conf in /usr/lib/NetworkManager/conf.d/).
# DNS: NetworkManager's dnsmasq plugin (dns=dnsmasq) runs a local
#   resolver on 127.0.0.1 and writes `nameserver 127.0.0.1` to
#   /etc/resolv.conf, forwarding upstream to whatever the router/DHCP
#   hands out.
#
# The wifi.backend selection lives in conf.d/wifi-backend.conf so the
# netoy-backend helper can switch between wpa_supplicant and iwd by
# rewriting that one file and restarting NetworkManager.

[main]
plugins=keyfile
dhcp=internal
dns=dnsmasq

[ifupdown]
managed=true
